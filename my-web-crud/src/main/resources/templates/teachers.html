<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teachers Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; }
        .container { margin-top: 20px; }
        .form-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .table-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Teachers Management</h1>
        <div th:if="${message}" th:class="'alert ' + ${alertClass} + ' alert-dismissible fade show p-2 px-3 m-0'" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Add/Edit Teacher Form -->
    <div class="form-section">
        <h5><i class="fas fa-plus"></i> Add/Edit Teacher</h5>
        <form th:action="@{/teachers/save}" th:object="${teacher}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">
            <div class="col-md-3">
                <label class="form-label">First Name</label>
                <input type="text" th:field="*{firstName}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Last Name</label>
                <input type="text" th:field="*{lastName}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Department</label>
                <select th:field="*{departmentObj.id}" class="form-select" required>
                    <option value="">Select Dept</option>
                    <option th:each="d : ${allDepartments}" th:value="${d.id}" th:text="${d.name}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Designation</label>
                <input type="text" th:field="*{designation}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control">
            </div>
            <div class="col-md-12 text-end">
                <button type="submit" class="btn btn-primary">Save Teacher</button>
            </div>
        </form>
    </div>

    <!-- Teachers List -->
    <div class="table-section">
        <h5><i class="fas fa-list"></i> All Teachers</h5>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Dept</th>
                    <th>Designation</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${teachers}">
                    <td th:text="${t.firstName + ' ' + t.lastName}"></td>
                    <td th:text="${t.email}"></td>
                    <td th:text="${t.departmentObj != null ? t.departmentObj.name : '-'}"></td>
                    <td th:text="${t.designation}"></td>
                    <td>
                        <a th:href="@{/teachers/edit(id=${t.id})}" class="btn btn-sm btn-info text-white"><i class="fas fa-edit"></i> Edit</a>
                        <a th:href="@{/teachers/delete(id=${t.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete teacher?')"><i class="fas fa-trash"></i> Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
