name: fflipy
description: "Fflipy - the trusted, dynamic and robust money transfer app"

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  curved_navigation_bar: ^1.0.3
  dotted_border: ^2.1.0
  dropdown_button2: ^2.3.9
  country_picker: ^2.0.22
  badges: ^3.1.2
  share_plus: ^12.0.1
  lottie: ^3.1.2
  # State Management & Dependency Injection
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  # Provider
  provider: ^6.0.0
  # Routing & Navigation
  go_router: ^14.1.1
  # Localization & Internationalization
  flutter_localizations:
    sdk: flutter
  # Local Storage
  shared_preferences: ^2.2.2
  # Database
  hive: ^2.2.3
  # Hive Database
  hive_flutter: ^1.1.0
  # API & Networking
  dio: ^5.9.0
  http_parser: ^4.0.0
  mime: ^1.0.5
  retrofit: ^4.1.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.0
  # Date & Time
  intl: ^0.20.2
  timeago: ^3.6.1
  # Utilities
  equatable: ^2.0.5
  url_launcher: ^6.2.1
  package_info_plus: ^8.3.1
  # Testing
  get_it: ^7.6.0
  #
  logger: ^2.1.0
  #
  flutter_secure_storage: ^9.0.0
  #
#  http_certificate_pinning: ^2.0.1
  image_picker: ^1.2.1
  file_picker: ^10.3.7
  pdf: ^3.10.8
  printing: ^5.11.1
  encrypt: ^5.0.3
  google_sign_in: ^6.2.1
  pin_code_fields: ^8.0.1
  fl_chart: ^0.63.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.13.1"

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.0
  hive_generator: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo_r.png"
  adaptive_icon_background: "#CACACA"
  adaptive_icon_foreground: "assets/logo/logo_r.png"


flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/fonts/
    - assets/preloader/
    - assets/logo/
    - assets/lottie/
    - assets/lang/

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
