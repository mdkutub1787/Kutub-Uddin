name: smart_shop
description: "SmartShop"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  easy_localization: ^3.0.7
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
