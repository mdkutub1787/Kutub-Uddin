name: deen_life
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  adhan: ^2.0.0+1
  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  flutter_compass: ^0.8.1
  quran: ^1.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  http: ^1.6.0
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  flutter_tts: ^4.2.5
  flutter_widget_from_html: ^0.17.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lang/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"
