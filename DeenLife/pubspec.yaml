name: deen_life
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  adhan: ^2.0.0+1
  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  flutter_compass: ^0.8.1
  quran: ^1.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  http: ^1.6.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
